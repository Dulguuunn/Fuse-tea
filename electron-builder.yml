# Builds release/win-unpacked/Notes.exe (no installer: the app stays in this folder and keeps
# its data in ../../data, i.e. C:\Note\data). Run with: npm run package
appId: com.dulguun.notes
productName: Notes
copyright: Personal use
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.ico
    to: icon.ico
asar: true
npmRebuild: false
win:
  target: dir
  icon: build/icon.ico
